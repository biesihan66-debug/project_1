<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1190" viewBox="0 0 1900 1190" font-family="Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="1900" height="1190" rx="8" fill="#f3f6f5" stroke="none"/>
<text x="48" y="63" font-size="34" fill="#233849" font-weight="700" text-anchor="start" >RLC / 面包板 V1.4</text>
<text x="48" y="115" font-size="32" fill="#233849" font-weight="700" text-anchor="start" >从一块主板开始，四线扩展留到最后</text>
<text x="48" y="158" font-size="20" fill="#567083" font-weight="400" text-anchor="start" >新版重点：电阻平放、逐孔占用检查、先测再加、模块连线分开画</text>
<rect x="44" y="218" width="1812" height="108" rx="8" fill="white" stroke="#d9e3e0"/>
<text x="70" y="263" font-size="28" fill="#087b73" font-weight="700" text-anchor="start" >01</text>
<text x="220" y="263" font-size="27" fill="#233849" font-weight="700" text-anchor="start" >偏置与供电</text>
<text x="220" y="299" font-size="23" fill="#567083" font-weight="400" text-anchor="start" >只装 R1/R2/C1，先测 3.3 V 和 1.65 V。</text>
<rect x="44" y="346" width="1812" height="108" rx="8" fill="white" stroke="#d9e3e0"/>
<text x="70" y="391" font-size="28" fill="#087b73" font-weight="700" text-anchor="start" >02</text>
<text x="220" y="391" font-size="27" fill="#233849" font-weight="700" text-anchor="start" >摆主板元件</text>
<text x="220" y="427" font-size="23" fill="#567083" font-weight="400" text-anchor="start" >U1 与反馈集中，电阻平放，每孔一根引脚。</text>
<rect x="44" y="474" width="1812" height="108" rx="8" fill="white" stroke="#d9e3e0"/>
<text x="70" y="519" font-size="28" fill="#087b73" font-weight="700" text-anchor="start" >03</text>
<text x="220" y="519" font-size="27" fill="#233849" font-weight="700" text-anchor="start" >接主板跳线</text>
<text x="220" y="555" font-size="23" fill="#567083" font-weight="400" text-anchor="start" >14 根编号线；先直插同一颗 1 kΩ 首测。</text>
<rect x="44" y="602" width="1812" height="108" rx="8" fill="white" stroke="#d9e3e0"/>
<text x="70" y="647" font-size="28" fill="#087b73" font-weight="700" text-anchor="start" >04–05</text>
<text x="220" y="647" font-size="27" fill="#233849" font-weight="700" text-anchor="start" >增加四线</text>
<text x="220" y="683" font-size="23" fill="#567083" font-weight="400" text-anchor="start" >S 板单独搭；补 Sense，只把 PA6 换到 S:g21。</text>
<rect x="44" y="730" width="1812" height="108" rx="8" fill="white" stroke="#d9e3e0"/>
<text x="70" y="775" font-size="28" fill="#087b73" font-weight="700" text-anchor="start" >06</text>
<text x="220" y="775" font-size="27" fill="#233849" font-weight="700" text-anchor="start" >外接与测量</text>
<text x="220" y="811" font-size="23" fill="#567083" font-weight="400" text-anchor="start" >DDS/OLED 放板外；K2 可代替外接按钮。</text>
<rect x="42" y="900" width="1816" height="140" rx="8" fill="white" stroke="#d9e3e0"/>
<text x="66" y="937" font-size="25" fill="#233849" font-weight="700" text-anchor="start" >本套文件与现有项目的关系</text>
<text x="66" y="976" font-size="21" fill="#567083" font-weight="400" text-anchor="start" >面包板升级为 V1.4；洞洞板继续用 V1.5（22×27 孔）；固件继续用 H743 V1.4。旧文件保留。</text>
<text x="66" y="1008" font-size="21" fill="#567083" font-weight="400" text-anchor="start" >先读“面包板先看这里”和逐孔 TXT。V1.3 面包板孔号不再混用；本图检查通过，实物仍需试摆和测量。</text>
</svg>