<text x="913" y="706" font-size="22" fill="#1f3040" font-weight="600" text-anchor="start" >PC4 / J3-26 → C8，始终采 TP2</text>
<rect x="42" y="800" width="1676" height="138" rx="12" fill="white" stroke="#d9e1e2" stroke-width="1" />
<text x="66" y="837" font-size="25" fill="#1f3040" font-weight="700" text-anchor="start" >这版解决的是焊接落地问题</text>
<text x="66" y="876" font-size="21" fill="#546b7d" font-weight="400" text-anchor="start" >底面不同网络无交叉；正面 7 根绝缘跳线分阶段编号；背面已镜像，提供逐孔连接表。</text>
<text x="66" y="910" font-size="21" fill="#546b7d" font-weight="400" text-anchor="start" >电路参数保持 1 kΩ ∥ 22 pF 固定反馈。图纸连通性已核对，焊接、电源、波形和精度待实物验收。</text>
