<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1040" viewBox="0 0 1760 1040" font-family="Microsoft YaHei, sans-serif">
<rect x="0" y="0" width="1760" height="1040" rx="0" fill="#f3f5f4" stroke="none" stroke-width="1" />
<text x="54" y="64" font-size="34" fill="#1f3040" font-weight="700" text-anchor="start" >RLC / 洞洞板 V1.4</text>
<text x="1705" y="62" font-size="28" fill="#546b7d" font-weight="700" text-anchor="end" >总览</text>
<text x="54" y="117" font-size="32" fill="#1f3040" font-weight="700" text-anchor="start" >洞洞板重新排布 / 以实际焊接顺序为主</text>
<text x="54" y="155" font-size="21" fill="#546b7d" font-weight="400" text-anchor="start" >仅洞洞板图纸更新到 V1.4；面包板沿用 V1.3，固件沿用 H743 V1.4。旧版文件保留。</text>
<rect x="54" y="202" width="374" height="176" rx="12" fill="white" stroke="#d9e1e2" stroke-width="1" />
<text x="76" y="241" font-size="23" fill="#087b73" font-weight="700" text-anchor="start" >01</text>
<text x="76" y="283" font-size="28" fill="#1f3040" font-weight="700" text-anchor="start" >摆元件</text>
<text x="76" y="321" font-size="20" fill="#546b7d" font-weight="400" text-anchor="start" >缺口全朝左，</text>
<text x="76" y="349" font-size="20" fill="#546b7d" font-weight="400" text-anchor="start" >按孔号预留四线区。</text>
<rect x="480" y="202" width="374" height="176" rx="12" fill="white" stroke="#d9e1e2" stroke-width="1" />
<text x="502" y="241" font-size="23" fill="#087b73" font-weight="700" text-anchor="start" >02</text>
<text x="502" y="283" font-size="28" fill="#1f3040" font-weight="700" text-anchor="start" >焊两线</text>
<text x="502" y="321" font-size="20" fill="#546b7d" font-weight="400" text-anchor="start" >先底面短线，</text>
<text x="502" y="349" font-size="20" fill="#546b7d" font-weight="400" text-anchor="start" >再装 T01、T02。</text>
<rect x="906" y="202" width="374" height="176" rx="12" fill="white" stroke="#d9e1e2" stroke-width="1" />
<text x="928" y="241" font-size="23" fill="#087b73" font-weight="700" text-anchor="start" >03</text>
<text x="928" y="283" font-size="28" fill="#1f3040" font-weight="700" text-anchor="start" >补四线</text>
<text x="928" y="321" font-size="20" fill="#546b7d" font-weight="400" text-anchor="start" >加 U2/U3 与取样网络，</text>
<text x="928" y="349" font-size="20" fill="#546b7d" font-weight="400" text-anchor="start" >不拆主线。</text>
<rect x="1332" y="202" width="374" height="176" rx="12" fill="white" stroke="#d9e1e2" stroke-width="1" />
<text x="1354" y="241" font-size="23" fill="#087b73" font-weight="700" text-anchor="start" >04</text>
