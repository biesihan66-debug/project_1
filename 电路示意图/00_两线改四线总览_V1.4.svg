<text x="1354" y="321" font-size="20" fill="#546b7d" font-weight="400" text-anchor="start" >1–2 改 2–3；</text>
<text x="1354" y="349" font-size="20" fill="#546b7d" font-weight="400" text-anchor="start" >PA6/PC4 引线不动。</text>
