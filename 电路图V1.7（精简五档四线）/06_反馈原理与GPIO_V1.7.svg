<text x="78" y="1058" font-size="21" fill="#183244" font-weight="400">先停 DDS、等衰减；去高档先吸该高档，再切 K0。回低档先释放 K0，再释放原高档。</text>
<text x="78" y="1091" font-size="21" fill="#183244" font-weight="400">K0 机械过渡靠 10 MΩ∥2.2 pF 维持反馈；一次只开一个高档。触点换位及停波用示波器核验。</text>
<text x="78" y="1124" font-size="21" fill="#183244" font-weight="400">D8–D11 的保底元件直接焊底板，反馈子板 A3/G18 引线尽量短。10 kΩ、100 kΩ 留补偿位。</text>
<text x="78" y="1157" font-size="21" fill="#183244" font-weight="400">线圈电源/回流沿边走。100 Ω 档 RF1 和限流 RSC 使用各自独立的元件。</text>
