<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1450" viewBox="0 0 1600 1450">
<rect width="100%" height="100%" fill="#eff4f3"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="56" y="63" font-size="26" fill="#176c91" font-weight="700">RLC 电桥 / 洞洞板 V1.7 / 08</text>
<text x="56" y="120" font-size="40" fill="#183244" font-weight="700">5 V 单路供电、ADC 调理与开发板排针</text>
<text x="56" y="163" font-size="22" fill="#486475" font-weight="400">V2、开发板 GND、调理板 GND 同地，线圈回流单独返回 5 V 入口。全部模拟信号先量后插。</text>
<rect x="56" y="206" width="735" height="267" rx="12" fill="#fff" stroke="#b5cbd0" stroke-width="2"/>
<text x="78" y="245" font-size="26" fill="#176c91" font-weight="700">供电连接</text>
<text x="78" y="285" font-size="21" fill="#183244" font-weight="400">外部唯一 5 V：+→J2-1、UA/UB.7、线圈与 ULN.9。</text>
<text x="78" y="318" font-size="21" fill="#183244" font-weight="400">地合点→J2-5、V2、子板电源地；A2 ← J2-3 3.3 V。</text>
<text x="78" y="351" font-size="21" fill="#183244" font-weight="400">RSH2-0505S/H2：14=+5 V（经 3.9 µH），1=GND。</text>
<text x="78" y="384" font-size="21" fill="#183244" font-weight="400">14 与 1 间贴 10 µF；2（CTRL）、6、7 留空。</text>
<text x="78" y="417" font-size="21" fill="#183244" font-weight="400">8（+VOUT）并系统 GND；9（−VOUT）为 −5 V。</text>
<text x="78" y="450" font-size="21" fill="#183244" font-weight="400">负轨 10 µF：正端接 GND、负端接 −5 V。</text>
<rect x="817" y="206" width="727" height="267" rx="12" fill="#fff" stroke="#b5cbd0" stroke-width="2"/>
<text x="839" y="245" font-size="26" fill="#176c91" font-weight="700">保留外设端口</text>
<text x="839" y="285" font-size="21" fill="#183244" font-weight="400">OLED：VCC=3.3 V，GND，SCL=PB8/J2-42，SDA=PB9/J2-41。</text>
<text x="839" y="318" font-size="21" fill="#183244" font-weight="400">PB10/J3-12 常开按键→GND；或连 J3-25 复用板载 K2。</text>
<text x="839" y="351" font-size="21" fill="#183244" font-weight="400">AD9833：3.3 V/GND、PA4/J3-30→FSYNC、PA5/J3-29→SCLK。</text>
<text x="839" y="384" font-size="21" fill="#183244" font-weight="400">PA7/J3-27→SDATA；模块 VOUT→原板 R15。</text>
<text x="839" y="417" font-size="21" fill="#183244" font-weight="400">PA8/J2-20 → MCLK（8 MHz）；模块自带时钟时 PA8 留空。</text>
<text x="839" y="450" font-size="21" fill="#183244" font-weight="400">用模块振荡器须改固件 MCLK 两个宏并重新编译。</text>
<text x="56" y="526" font-size="27" fill="#176c91" font-weight="700">两路 ADC 分别按此接法焊一份，BAT54S 贴近 MCU</text>
<rect x="56" y="607" width="258" height="78" rx="12" fill="#ffffff" stroke="#b5cbd0" stroke-width="2"/>
<text x="69" y="637" font-size="21" fill="#183244" font-weight="700">输入 IN</text>
<text x="69" y="666" font-size="17" fill="#486475" font-weight="400">U9 或 C8</text>
<polyline points="314,646 417,646" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="417" y="637" width="50" height="18" fill="white" stroke="#176c91" stroke-width="3"/>
<polyline points="467,646 571,646" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="418" y="629" font-size="17" fill="#176c91" font-weight="700">5.60 kΩ</text>
<polyline points="571,646 1330,646" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1330" y="607" width="214" height="78" rx="12" fill="#ffffff" stroke="#b5cbd0" stroke-width="2"/>
<text x="1343" y="637" font-size="21" fill="#183244" font-weight="700">ADC</text>
<text x="1343" y="666" font-size="17" fill="#486475" font-weight="400">PA6 或 PC4</text>
<polyline points="571,646 571,580 603,580" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="603,580 668,580" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="668" y="571" width="50" height="18" fill="white" stroke="#176c91" stroke-width="3"/>
<polyline points="718,580 784,580" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="669" y="563" font-size="17" fill="#176c91" font-weight="700">3.00 kΩ</text>
<text x="795" y="587" font-size="20" fill="#183244" font-weight="700">3.3 V</text>
<circle cx="571" cy="646" r="5" fill="#176c91"/>
<polyline points="571,646 571,704" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="557" y="704" width="144" height="38" rx="12" fill="#fff" stroke="#b5cbd0" stroke-width="2"/>
<text x="568" y="730" font-size="16" fill="#183244" font-weight="700">7.50 kΩ</text>
<polyline points="571,742 571,780" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="557" y="809" font-size="19" fill="#183244" font-weight="700">GND</text>
<circle cx="784" cy="646" r="5" fill="#176c91"/>
<polyline points="784,646 784,704" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="770" y="704" width="144" height="38" rx="12" fill="#fff" stroke="#b5cbd0" stroke-width="2"/>
<text x="781" y="730" font-size="16" fill="#183244" font-weight="700">47 pF C0G</text>
<polyline points="784,742 784,780" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="770" y="809" font-size="19" fill="#183244" font-weight="700">GND</text>
<circle cx="1024" cy="646" r="5" fill="#176c91"/>
<polyline points="1024,646 1024,704" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1010" y="704" width="200" height="38" rx="12" fill="#fff" stroke="#b5cbd0" stroke-width="2"/>
<text x="1021" y="730" font-size="16" fill="#183244" font-weight="700">BAT54S 脚 3 / 二极管中点</text>
<polyline points="1024,742 1024,780" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1011" y="809" font-size="20" fill="#183244" font-weight="700">脚 1→GND；脚 2→3.3 V</text>
<rect x="56" y="849" width="1488" height="37" rx="12" fill="#dcebed" stroke="#e0e8e7" stroke-width="2"/>
<text x="68" y="875" font-size="20" fill="#183244" font-weight="700">主板信号</text>
<text x="398" y="875" font-size="20" fill="#183244" font-weight="700">调理输入</text>
<text x="698" y="875" font-size="20" fill="#183244" font-weight="700">调理输出</text>
<text x="1013" y="875" font-size="20" fill="#183244" font-weight="700">MCU 接线</text>
<rect x="56" y="886" width="1488" height="37" rx="12" fill="#ffffff" stroke="#e0e8e7" stroke-width="2"/>
<text x="68" y="912" font-size="18" fill="#183244" font-weight="400">U9（JP1 中脚）</text>
<text x="398" y="912" font-size="18" fill="#183244" font-weight="400">V.IN</text>
<text x="698" y="912" font-size="18" fill="#183244" font-weight="400">V.OUT</text>
<text x="1013" y="912" font-size="18" fill="#183244" font-weight="400">PA6 / J3-28 / ADC1_INP3</text>
<rect x="56" y="923" width="1488" height="37" rx="12" fill="#ffffff" stroke="#e0e8e7" stroke-width="2"/>
<text x="68" y="949" font-size="18" fill="#183244" font-weight="400">C8（TP2）</text>
<text x="398" y="949" font-size="18" fill="#183244" font-weight="400">I.IN</text>
<text x="698" y="949" font-size="18" fill="#183244" font-weight="400">I.OUT</text>
<text x="1013" y="949" font-size="18" fill="#183244" font-weight="400">PC4 / J3-26 / ADC2_INP4</text>
<rect x="56" y="960" width="1488" height="37" rx="12" fill="#ffffff" stroke="#e0e8e7" stroke-width="2"/>
<text x="68" y="986" font-size="18" fill="#183244" font-weight="400">V2（GND）</text>
<text x="398" y="986" font-size="18" fill="#183244" font-weight="400">GND</text>
<text x="698" y="986" font-size="18" fill="#183244" font-weight="400">GND</text>
<text x="1013" y="986" font-size="18" fill="#183244" font-weight="400">J2-5 / 公共地</text>
<rect x="56" y="997" width="1488" height="37" rx="12" fill="#ffffff" stroke="#e0e8e7" stroke-width="2"/>
<text x="68" y="1023" font-size="18" fill="#183244" font-weight="400">A2（3.3 V）</text>
<text x="398" y="1023" font-size="18" fill="#183244" font-weight="400">3.3 V</text>
<text x="698" y="1023" font-size="18" fill="#183244" font-weight="400">3.3 V</text>
<text x="1013" y="1023" font-size="18" fill="#183244" font-weight="400">J2-3 / H743 3.3 V</text>
<rect x="56" y="1066" width="1488" height="201" rx="12" fill="#fff" stroke="#b5cbd0" stroke-width="2"/>
<text x="78" y="1105" font-size="26" fill="#176c91" font-weight="700">上电前先把原 U9→PA6、C8→PC4 直连线拔掉</text>
<text x="78" y="1145" font-size="21" fill="#183244" font-weight="400">BAT54S 脚 1 是下管阳极、脚 2 是上管阴极、脚 3 为中点。用万用表二极管档核实方向。</text>
<text x="78" y="1178" font-size="21" fill="#183244" font-weight="400">名义 3.3 V 时输入 ±5.25 V 对应约 0.25～3.16 V；验收以实际 VDDA 为准。</text>
<text x="78" y="1211" font-size="21" fill="#183244" font-weight="400">PA6、PC4 先悬空。开关机、空载、限流短接、10 Ω 和 100 kHz 下用示波器量调理输出。</text>
<text x="78" y="1244" font-size="21" fill="#183244" font-weight="400">5 V 与 3.3 V 同源。测试 ST-Link 接、拔状态；若掉电时 3.3 V 被钳位回灌，先解决电源时序。</text>
</g></svg>