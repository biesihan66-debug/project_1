<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
<rect width="100%" height="100%" fill="#eff4f3"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="56" y="63" font-size="26" fill="#176c91" font-weight="700">RLC 电桥 / 洞洞板 V1.7 / 00</text>
<text x="56" y="120" font-size="40" fill="#183244" font-weight="700">施工顺序</text>
<text x="56" y="163" font-size="22" fill="#486475" font-weight="400">现状是 V1.5 两线已焊。主板继续使用，先分步通断检查，再接总线束。</text>
<rect x="56" y="221" width="733" height="215" rx="12" fill="#fff" stroke="#b5cbd0" stroke-width="2"/>
<text x="80" y="270" font-size="31" fill="#176c91" font-weight="700">1　先补四线</text>
<text x="80" y="309" font-size="20" fill="#486475" font-weight="400">03 / 04 附图</text>
<text x="80" y="354" font-size="23" fill="#183244" font-weight="400">焊 U2、U3 与 B22–B36、T03–T07。</text>
<text x="80" y="396" font-size="22" fill="#31715d" font-weight="700">断电查 3.3 V 与 GND；Sense 两根独立。</text>
<rect x="811" y="221" width="733" height="215" rx="12" fill="#fff" stroke="#b5cbd0" stroke-width="2"/>
<text x="835" y="270" font-size="31" fill="#176c91" font-weight="700">2　改已焊底板</text>
<text x="835" y="309" font-size="20" fill="#486475" font-weight="400">01 / 02 / 05 图</text>
<text x="835" y="354" font-size="23" fill="#183244" font-weight="400">拆 Rf、Cf、R5；C4 换 220 pF。</text>
<text x="835" y="396" font-size="22" fill="#31715d" font-weight="700">U1 转接只隔离 1、7；确认 3 直通。</text>
<rect x="56" y="481" width="733" height="215" rx="12" fill="#fff" stroke="#b5cbd0" stroke-width="2"/>
<text x="80" y="530" font-size="31" fill="#176c91" font-weight="700">3　先验子板再插入</text>
<text x="80" y="569" font-size="20" fill="#486475" font-weight="400">05 / 06 / 07 图</text>
<text x="80" y="614" font-size="23" fill="#183244" font-weight="400">先验 ±5 V、继电器和 100 Ω 限流。</text>
<text x="80" y="656" font-size="22" fill="#31715d" font-weight="700">原先两根 ADC 直连线先拔。</text>
<rect x="811" y="481" width="733" height="215" rx="12" fill="#fff" stroke="#b5cbd0" stroke-width="2"/>
<text x="835" y="530" font-size="31" fill="#176c91" font-weight="700">4　总装与实测</text>
<text x="835" y="569" font-size="20" fill="#486475" font-weight="400">08 / 09 图</text>
<text x="835" y="614" font-size="23" fill="#183244" font-weight="400">ADC 电平合格才接 MCU；JP1 插 2–3。</text>
<text x="835" y="656" font-size="22" fill="#31715d" font-weight="700">先 1 kΩ，再 10 Ω，最后校准和高频。</text>
<rect x="56" y="755" width="1488" height="168" rx="12" fill="#fff" stroke="#b5cbd0" stroke-width="2"/>
<text x="78" y="794" font-size="26" fill="#176c91" font-weight="700">焊接用的三个约定</text>
<text x="78" y="834" font-size="21" fill="#183244" font-weight="400">原板元件面 A 行在上、列号 1→27；翻看焊接面仍让 A 在上，此时列号 27→1。子板同理。</text>
<text x="78" y="867" font-size="21" fill="#183244" font-weight="400">图上直角线表示可走的路线，圆点才是端点。用短绝缘线焊两端，过中间孔不拉锡。</text>
<text x="78" y="900" font-size="21" fill="#183244" font-weight="400">U1 转接、子板及 ADC 端子请先贴标签。F− 是跨阻节点，接夹具；公共 GND 留给电源和信号回流。</text>
</g></svg>