<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1225" viewBox="0 0 1600 1225">
<rect width="100%" height="100%" fill="#eff4f3"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="56" y="63" font-size="26" fill="#176c91" font-weight="700">RLC 电桥 / 洞洞板 V1.7 / 09</text>
<text x="56" y="120" font-size="40" fill="#183244" font-weight="700">Kelvin 四线与差分电压采样</text>
<text x="56" y="163" font-size="22" fill="#486475" font-weight="400">两只双触点夹。同一端的 Force 和 Sense 分开走，Sense 触点靠 DUT 本体。</text>
<rect x="56" y="257" width="230" height="78" rx="12" fill="#ffffff" stroke="#b5cbd0" stroke-width="2"/>
<text x="69" y="287" font-size="21" fill="#183244" font-weight="700">TP1 / I4</text>
<text x="69" y="316" font-size="17" fill="#486475" font-weight="400">F+ 负责送电流</text>
<rect x="1314" y="257" width="230" height="78" rx="12" fill="#ffffff" stroke="#b5cbd0" stroke-width="2"/>
<text x="1327" y="287" font-size="21" fill="#183244" font-weight="700">TIA_N / C9</text>
<text x="1327" y="316" font-size="17" fill="#486475" font-weight="400">F− 接 U1B 脚 6</text>
<polyline points="286,296 670,296" fill="none" stroke="#b84432" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="316" y="280" font-size="17" fill="#b84432" font-weight="700">F+</text>
<polyline points="670,296 771,296" fill="none" stroke="#b84432" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="771" y="287" width="50" height="18" fill="white" stroke="#b84432" stroke-width="3"/>
<polyline points="821,296 922,296" fill="none" stroke="#b84432" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="772" y="279" font-size="17" fill="#b84432" font-weight="700">DUT</text>
<polyline points="922,296 1314,296" fill="none" stroke="#b84432" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1226" y="280" font-size="17" fill="#b84432" font-weight="700">F−</text>
<circle cx="684" cy="296" r="5" fill="#b84432"/>
<circle cx="907" cy="296" r="5" fill="#b84432"/>
<polyline points="684,296 684,407 394,407" fill="none" stroke="#31715d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="421" y="396" font-size="17" fill="#31715d" font-weight="700">S+ → J14</text>
<polyline points="907,296 907,407 1206,407" fill="none" stroke="#31715d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1059" y="396" font-size="17" fill="#31715d" font-weight="700">S− → E15</text>
<rect x="56" y="369" width="338" height="78" rx="12" fill="#ffffff" stroke="#b5cbd0" stroke-width="2"/>
<text x="69" y="399" font-size="21" fill="#183244" font-weight="700">U2A 电压跟随</text>
<text x="69" y="428" font-size="17" fill="#486475" font-weight="400">3=S+；1 与 2 相连（BUF_P）</text>
<rect x="1206" y="369" width="338" height="78" rx="12" fill="#ffffff" stroke="#b5cbd0" stroke-width="2"/>
<text x="1219" y="399" font-size="21" fill="#183244" font-weight="700">U2B 电压跟随</text>
<text x="1219" y="428" font-size="17" fill="#486475" font-weight="400">5=S−；7 与 6 相连（BUF_N）</text>
<rect x="579" y="539" width="432" height="78" rx="12" fill="#ffffff" stroke="#b5cbd0" stroke-width="2"/>
<text x="592" y="569" font-size="21" fill="#183244" font-weight="700">U3A 差分 / U3B VREF 跟随</text>
<text x="592" y="598" font-size="17" fill="#486475" font-weight="400">U3.1 → VDIFF / U10</text>
<polyline points="228,447 228,577 579,577" fill="none" stroke="#31715d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="248" y="558" font-size="17" fill="#31715d" font-weight="700">R7 10 kΩ 到 U3.3</text>
<polyline points="1374,447 1374,577 1011,577" fill="none" stroke="#31715d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1081" y="558" font-size="17" fill="#31715d" font-weight="700">R8 10 kΩ 到 U3.2</text>
<rect x="56" y="674" width="1488" height="201" rx="12" fill="#fff" stroke="#b5cbd0" stroke-width="2"/>
<text x="78" y="713" font-size="26" fill="#176c91" font-weight="700">补装四线电路</text>
<text x="78" y="753" font-size="21" fill="#183244" font-weight="400">R9 10 kΩ：U3.1 到 U3.2。R10 10 kΩ：U3.7 到 U3.3。R7–R10 为 0.1% 匹配组。</text>
<text x="78" y="786" font-size="21" fill="#183244" font-weight="400">U3.5=VREF（原板 S4），U3.6 与 7 相连为 VBUF。U2/U3 的 8=3.3 V、4=GND，各有 100 nF。</text>
<text x="78" y="819" font-size="21" fill="#183244" font-weight="400">VREF 由 3.3 V—R1 1 kΩ—VREF—R2 1 kΩ—GND 建立；C1 22 µF 正端接 VREF。</text>
<text x="78" y="852" font-size="21" fill="#183244" font-weight="400">差分相位方向：VDIFF≈VREF+S+−S−。原 V1.5 的 U2/U3 孔位与 03/04 附图完全对应。</text>
<rect x="56" y="918" width="1488" height="135" rx="12" fill="#fff" stroke="#b5cbd0" stroke-width="2"/>
<text x="78" y="957" font-size="26" fill="#176c91" font-weight="700">JP1 和固件设置对齐</text>
<text x="78" y="997" font-size="21" fill="#183244" font-weight="400">U8（1）=TP1、U9（2）=调理输入 V.IN、U10（3）=VDIFF。四线插 U9–U10，固件选 4W。</text>
<text x="78" y="1030" font-size="21" fill="#183244" font-weight="400">4W 开校用两个彼此绝缘的端片，每片接同侧 F、S；短校再将两端片短接。2W/4W 各存一份。</text>
</g></svg>