<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1380" viewBox="0 0 1600 1380">
<rect width="100%" height="100%" fill="#eff4f3"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="56" y="63" font-size="26" fill="#176c91" font-weight="700">RLC 电桥 / 洞洞板 V1.7 / 05</text>
<text x="56" y="120" font-size="40" fill="#183244" font-weight="700">U1 转接、双缓冲和限流触点</text>
<text x="56" y="163" font-size="22" fill="#486475" font-weight="400">脚号按 MCP6022-I/P（PDIP-8）和 BUF634AID（SOIC-8）。交叉处无圆点为绝缘跨线。</text>
<rect x="56" y="243" width="205" height="78" rx="12" fill="#ffffff" stroke="#b5cbd0" stroke-width="2"/>
<text x="69" y="273" font-size="21" fill="#183244" font-weight="700">DDS / R15</text>
<text x="69" y="302" font-size="17" fill="#486475" font-weight="400">来自 AD9833 VOUT</text>
<polyline points="261,282 308,282" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="308" y="273" width="50" height="18" fill="white" stroke="#176c91" stroke-width="3"/>
<polyline points="358,282 405,282" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="309" y="265" font-size="17" fill="#176c91" font-weight="700">R3 1k</text>
<rect x="405" y="243" width="163" height="78" rx="12" fill="#ffffff" stroke="#b5cbd0" stroke-width="2"/>
<text x="418" y="273" font-size="21" fill="#183244" font-weight="700">C3 1 µF</text>
<text x="418" y="302" font-size="17" fill="#486475" font-weight="400">无极性</text>
<polyline points="568,282 649,282" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="568" y="270" font-size="17" fill="#176c91" font-weight="700">DRV_P</text>
<rect x="649" y="243" width="196" height="78" rx="12" fill="#ffffff" stroke="#b5cbd0" stroke-width="2"/>
<text x="662" y="273" font-size="21" fill="#183244" font-weight="700">U1A MCP6022</text>
<text x="662" y="302" font-size="17" fill="#486475" font-weight="400">3+=DRV_P；2−=J7</text>
<polyline points="845,282 924,282" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="850" y="269" font-size="17" fill="#176c91" font-weight="700">1 / 顶</text>
<rect x="924" y="243" width="205" height="78" rx="12" fill="#ffffff" stroke="#b5cbd0" stroke-width="2"/>
<text x="937" y="273" font-size="21" fill="#183244" font-weight="700">UA · BUF634A</text>
<text x="937" y="302" font-size="17" fill="#486475" font-weight="400">3=IN；6=OUT</text>
<polyline points="1129,282 1178,282 1178,390" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1168" y="272" font-size="17" fill="#176c91" font-weight="700">PA_OUT</text>
<polyline points="1178,390 1236,390" fill="none" stroke="#b84432" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1236" y="381" width="50" height="18" fill="white" stroke="#b84432" stroke-width="3"/>
<polyline points="1286,390 1344,390" fill="none" stroke="#b84432" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1237" y="373" font-size="17" fill="#b84432" font-weight="700">RSC 100Ω</text>
<polyline points="1178,390 1178,445 1218,445 1268,426" fill="none" stroke="#b84432" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1178" y="475" font-size="17" fill="#b84432" font-weight="700">3 COM</text>
<polyline points="1301,445 1344,445 1344,390" fill="none" stroke="#b84432" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1298" y="475" font-size="17" fill="#b84432" font-weight="700">4 NO</text>
<circle cx="1178" cy="390" r="5" fill="#b84432"/>
<circle cx="1344" cy="390" r="5" fill="#b84432"/>
<polyline points="1344,390 1510,390" fill="none" stroke="#b84432" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1352" y="373" font-size="17" fill="#b84432" font-weight="700">TP1 → I7/I4</text>
<text x="1183" y="515" font-size="20" fill="#b84432" font-weight="700">KCAL-A 失电时 3/4 断开；2 悬空。</text>
<rect x="56" y="344" width="1068" height="168" rx="12" fill="#fff" stroke="#b5cbd0" stroke-width="2"/>
<text x="78" y="383" font-size="26" fill="#176c91" font-weight="700">U1A 激励与反馈</text>
<text x="78" y="423" font-size="21" fill="#183244" font-weight="400">R4 100 kΩ 与 C4 220 pF 并联 DRV_P—VREF；R6 10 kΩ 接 J7—VREF。</text>
<text x="78" y="456" font-size="21" fill="#183244" font-weight="400">KCAL-B：7(NC)=PA_OUT，5(NO)=TP1，6(COM) 经 10 kΩ+20 kΩ 微调到 J7。</text>
<text x="78" y="489" font-size="21" fill="#183244" font-weight="400">微调的滑端并至一个外脚，先量总值约 13 kΩ。PA_OUT—J7 始终接 1 MΩ。</text>
<rect x="56" y="587" width="223" height="78" rx="12" fill="#ffffff" stroke="#b5cbd0" stroke-width="2"/>
<text x="69" y="617" font-size="21" fill="#183244" font-weight="700">F− / C9 → D11</text>
<text x="69" y="646" font-size="17" fill="#486475" font-weight="400">TIA_N 接 U1B 6−</text>
<polyline points="279,626 331,626" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="331" y="587" width="248" height="78" rx="12" fill="#ffffff" stroke="#b5cbd0" stroke-width="2"/>
<text x="344" y="617" font-size="21" fill="#183244" font-weight="700">U1B MCP6022</text>
<text x="344" y="646" font-size="17" fill="#486475" font-weight="400">5+=VREF；6−=TIA_N</text>
<polyline points="579,626 672,626" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="593" y="610" font-size="17" fill="#176c91" font-weight="700">7 / 顶</text>
<rect x="672" y="587" width="224" height="78" rx="12" fill="#ffffff" stroke="#b5cbd0" stroke-width="2"/>
<text x="685" y="617" font-size="21" fill="#183244" font-weight="700">UB · BUF634A</text>
<text x="685" y="646" font-size="17" fill="#486475" font-weight="400">3=IN；6=OUT</text>
<polyline points="896,626 977,626" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="908" y="610" font-size="17" fill="#176c91" font-weight="700">TP2</text>
<rect x="977" y="587" width="483" height="78" rx="12" fill="#ffffff" stroke="#b5cbd0" stroke-width="2"/>
<text x="990" y="617" font-size="21" fill="#183244" font-weight="700">F8（U1 底脚 7）</text>
<text x="990" y="646" font-size="17" fill="#486475" font-weight="400">D8 → 五档反馈；C8 → ADC 调理</text>
<polyline points="1063,665 1063,717 700,717" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="415" y="680" width="285" height="78" rx="12" fill="#ffffff" stroke="#b5cbd0" stroke-width="2"/>
<text x="428" y="710" font-size="21" fill="#183244" font-weight="700">五档反馈 · 见 06</text>
<text x="428" y="739" font-size="17" fill="#486475" font-weight="400">永接 10 MΩ ∥ 2.2 pF</text>
<polyline points="415,717 181,717 181,665" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="56" y="800" width="1488" height="234" rx="12" fill="#fff" stroke="#b5cbd0" stroke-width="2"/>
<text x="78" y="839" font-size="26" fill="#176c91" font-weight="700">U1 转接板逐脚｜缺口对准原座；只切断两根上下直通</text>
<text x="78" y="879" font-size="21" fill="#183244" font-weight="400">1：U1 顶脚到 UA.3。底脚 I7 独立，到 TP1（继电器板 L7）。断电量顶脚 1 与 I7 无直通。</text>
<text x="78" y="912" font-size="21" fill="#183244" font-weight="400">7：U1 顶脚到 UB.3。底脚 F8 独立，到 UB.6。断电量顶脚 7 与 F8 无直通。</text>
<text x="78" y="945" font-size="21" fill="#183244" font-weight="400">2=J7 网络（原座 I8）、3=I9、4=GND、5=VREF、6=D11 网络、8=3.3 V，上下直通。</text>
<text x="78" y="978" font-size="21" fill="#183244" font-weight="400">UA/UB 每只：1（BW）和 4（V−）→−5 V；7→+5 V；2/5/8 留空。每轨就近 100 nF 到 GND。</text>
<text x="78" y="1011" font-size="21" fill="#183244" font-weight="400">UA.6→L3；UB.6→F8。U1 转接板靠近 BUF 转接板，用短线；反馈板靠 D8/D11。</text>
<rect x="56" y="1088" width="1488" height="168" rx="12" fill="#fff" stroke="#b5cbd0" stroke-width="2"/>
<text x="78" y="1127" font-size="26" fill="#176c91" font-weight="700">KCAL 两种接法</text>
<text x="78" y="1167" font-size="21" fill="#183244" font-weight="400">PB14=0：线圈释放。PA_OUT→100 Ω→TP1，U1A 回采 PA_OUT；用在上电、试测、短校。</text>
<text x="78" y="1200" font-size="21" fill="#183244" font-weight="400">PB14=1：线圈吸合。A 极旁路 100 Ω；B 极改回采 TP1，供量值采集。换位期间仍有 1 MΩ 直流回路。</text>
<text x="78" y="1233" font-size="21" fill="#183244" font-weight="400">每次切换前停 DDS。示波器验证停波残留与触点稳定，再按 TP1 实测调幅到 0.45–0.55 Vrms。</text>
</g></svg>