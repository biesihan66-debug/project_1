<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1345" viewBox="0 0 1600 1345">
<rect width="100%" height="100%" fill="#eff4f3"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="56" y="63" font-size="26" fill="#176c91" font-weight="700">RLC 电桥 / 洞洞板 V1.6 / 04</text>
<text x="56" y="120" font-size="40" fill="#183244" font-weight="700">过流保护、采样与 MCU 接线</text>
<text x="56" y="163" font-size="22" fill="#486475" font-weight="400">先测保护功能，再接 ADC。过流直接静音并锁存，短校准在串联 100 Ω 的状态下进行。</text>
<rect x="56" y="222" width="241" height="78" rx="12" fill="#ffffff" stroke="#b5cbd0" stroke-width="2"/>
<text x="69" y="252" font-size="21" fill="#183244" font-weight="700">RS 两端</text>
<text x="69" y="281" font-size="17" fill="#486475" font-weight="400">四端取样，串入 0.22 Ω</text>
<rect x="336" y="222" width="246" height="78" rx="12" fill="#ffffff" stroke="#b5cbd0" stroke-width="2"/>
<text x="349" y="252" font-size="21" fill="#183244" font-weight="700">INA240A2</text>
<text x="349" y="281" font-size="17" fill="#486475" font-weight="400">REF1=5 V / REF2=GND</text>
<rect x="622" y="222" width="243" height="78" rx="12" fill="#ffffff" stroke="#b5cbd0" stroke-width="2"/>
<text x="635" y="252" font-size="21" fill="#183244" font-weight="700">TLV1702</text>
<text x="635" y="281" font-size="17" fill="#486475" font-weight="400">窗口约 0.91～4.09 V</text>
<rect x="907" y="222" width="251" height="78" rx="12" fill="#ffffff" stroke="#b5cbd0" stroke-width="2"/>
<text x="920" y="252" font-size="21" fill="#183244" font-weight="700">LVC1G74</text>
<text x="920" y="281" font-size="17" fill="#486475" font-weight="400">过流置位，PB14 清锁存</text>
<rect x="1202" y="222" width="341" height="78" rx="12" fill="#ffffff" stroke="#b5cbd0" stroke-width="2"/>
<text x="1215" y="252" font-size="21" fill="#183244" font-weight="700">TS5A3159A</text>
<text x="1215" y="281" font-size="17" fill="#486475" font-weight="400">低=1.65 V 静音；高=原激励</text>
<polyline points="297,260 336,260" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="582,260 622,260" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="865,260 907,260" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="1158,260 1202,260" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="56" y="363" width="735" height="333" rx="12" fill="#fff" stroke="#b5cbd0" stroke-width="2"/>
<text x="78" y="402" font-size="26" fill="#176c91" font-weight="700">保护电路接线</text>
<text x="78" y="442" font-size="21" fill="#183244" font-weight="400">INA240 OUT=ISNS。+5→9.09k→VH→31.6k→VL→9.09k→GND。</text>
<text x="78" y="475" font-size="21" fill="#183244" font-weight="400">比较器 A：+=VH、−=ISNS；B：+=ISNS、−=VL。</text>
<text x="78" y="508" font-size="21" fill="#183244" font-weight="400">两开集输出并联 OC_N，10 kΩ 上拉到 3.3 V。</text>
<text x="78" y="541" font-size="21" fill="#183244" font-weight="400">LVC1G74：PRE#=OC_N，D/CLK=GND，Q=FAULT。</text>
<text x="78" y="574" font-size="21" fill="#183244" font-weight="400">CLR# = PB14 OR FAULT_RAW；FAULT_RAW 由 OC_N 反相。</text>
<text x="78" y="607" font-size="21" fill="#183244" font-weight="400">EN = PB12 AND Q#；FAULT 接 PB13。</text>
<text x="78" y="640" font-size="21" fill="#183244" font-weight="400">UGate：IN=EN，NC=缓冲 VREF，NO=板座 I9。</text>
<text x="78" y="673" font-size="21" fill="#183244" font-weight="400">COM → U1 顶脚 3，并以 1 MΩ 接缓冲 VREF。</text>
<rect x="817" y="363" width="727" height="300" rx="12" fill="#fff" stroke="#b5cbd0" stroke-width="2"/>
<text x="839" y="402" font-size="26" fill="#176c91" font-weight="700">新增 GPIO（含上电状态）</text>
<text x="839" y="442" font-size="21" fill="#183244" font-weight="400">PB12 / J3-10：RUN，高=准许输出；47 kΩ 下拉。</text>
<text x="839" y="475" font-size="21" fill="#183244" font-weight="400">PB13 / J3-9：FAULT，高=已锁存；读输入。</text>
<text x="839" y="508" font-size="21" fill="#183244" font-weight="400">PB14 / J3-8：CLR_REQ_N，低脉冲清除；47 kΩ 上拉。</text>
<text x="839" y="541" font-size="21" fill="#183244" font-weight="400">PB15 / J3-7：NORMAL，高=正常测量；47 kΩ 下拉。</text>
<text x="839" y="574" font-size="21" fill="#183244" font-weight="400">复位 RUN=0、NORMAL=0、档位码=0，先量各模拟电源。</text>
<text x="839" y="607" font-size="21" fill="#183244" font-weight="400">故障清除前保持静音，短路线移除后方可重启测量。</text>
<text x="839" y="640" font-size="21" fill="#183244" font-weight="400">J4 扩展 TFT 接口留空；本机 OLED 仍从 PB8/PB9 接。</text>
<rect x="56" y="736" width="1488" height="201" rx="12" fill="#fff" stroke="#b5cbd0" stroke-width="2"/>
<text x="78" y="775" font-size="26" fill="#176c91" font-weight="700">两路 ADC 都经衰减和限幅</text>
<text x="78" y="815" font-size="21" fill="#183244" font-weight="400">U9 → 4.7 kΩ → ADC_V → PA6/J3-28；C8 → 4.7 kΩ → ADC_I → PC4/J3-26。每路另经 1.33 kΩ 接 VREF_BUF。</text>
<text x="78" y="848" font-size="21" fill="#183244" font-weight="400">每路加 47 pF 对地和 BAT54S。下管阳极接地，上管阴极接 3.3 V，两管的中点接 ADC。</text>
<text x="78" y="881" font-size="21" fill="#183244" font-weight="400">S4 → TLV9061 跟随器（3.3 V）→ VREF_BUF，同时供 UGate.NC。信号衰减约 0.221 倍，±5 V 输入约映射 0.18～2.39 V。</text>
<text x="78" y="914" font-size="21" fill="#183244" font-weight="400">先测分压、上掉电时序和故障电平再接 MCU，幅相在 100 kHz 实测。逻辑 3.3 V，INA240/TLV1702 5 V，全部共地。</text>
<rect x="56" y="1000" width="1488" height="168" rx="12" fill="#fff" stroke="#b5cbd0" stroke-width="2"/>
<text x="78" y="1039" font-size="26" fill="#176c91" font-weight="700">保护门限和验收顺序</text>
<text x="78" y="1079" font-size="21" fill="#183244" font-weight="400">估算 |I| 门限约 145 mA 峰值。比较器/继电器/功率回路的延时、触点抖动以及短路峰值须实测。</text>
<text x="78" y="1112" font-size="21" fill="#183244" font-weight="400">先测电源，再测 1 kΩ 两线、10 Ω 两线与过流停机、各档、四线，最后固定夹具并校准 100 kHz / 10 pF。</text>
<text x="78" y="1145" font-size="21" fill="#183244" font-weight="400">拨过 JP1、换夹具或改反馈/线束后核对校准配置。图纸覆盖目标接口，实物精度和用时待验收。</text>
</g></svg>