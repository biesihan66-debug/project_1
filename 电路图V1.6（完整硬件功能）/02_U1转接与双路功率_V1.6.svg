<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240">
<rect width="100%" height="100%" fill="#eff4f3"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="56" y="63" font-size="26" fill="#176c91" font-weight="700">RLC 电桥 / 洞洞板 V1.6 / 02</text>
<text x="56" y="120" font-size="40" fill="#183244" font-weight="700">功率子板与 U1 转接</text>
<text x="56" y="163" font-size="22" fill="#486475" font-weight="400">U1 的两半保留作误差放大器。加两只 BUF634A，让驱动和跨阻输出都能带低阻电流。</text>
<rect x="56" y="235" width="215" height="78" rx="12" fill="#ffffff" stroke="#b5cbd0" stroke-width="2"/>
<text x="69" y="265" font-size="21" fill="#183244" font-weight="700">U1A 脚 1</text>
<text x="69" y="294" font-size="17" fill="#486475" font-weight="400">转接板顶层 RAW_A</text>
<rect x="320" y="235" width="212" height="78" rx="12" fill="#ffffff" stroke="#b5cbd0" stroke-width="2"/>
<text x="333" y="265" font-size="21" fill="#183244" font-weight="700">UA · BUF634A</text>
<text x="333" y="294" font-size="17" fill="#486475" font-weight="400">RAW_A → PA_OUT</text>
<rect x="579" y="235" width="188" height="78" rx="12" fill="#ffffff" stroke="#b5cbd0" stroke-width="2"/>
<text x="592" y="265" font-size="21" fill="#183244" font-weight="700">RS · 0.22 Ω</text>
<text x="592" y="294" font-size="17" fill="#486475" font-weight="400">四端取样 → INA240</text>
<rect x="817" y="235" width="209" height="78" rx="12" fill="#ffffff" stroke="#b5cbd0" stroke-width="2"/>
<text x="830" y="265" font-size="21" fill="#183244" font-weight="700">RSC · 100 Ω</text>
<text x="830" y="294" font-size="17" fill="#486475" font-weight="400">KCAL-A 常开触点跨接</text>
<rect x="1080" y="235" width="230" height="78" rx="12" fill="#ffffff" stroke="#b5cbd0" stroke-width="2"/>
<text x="1093" y="265" font-size="21" fill="#183244" font-weight="700">TP1 / Force+</text>
<text x="1093" y="294" font-size="17" fill="#486475" font-weight="400">板座 I7 → I4</text>
<rect x="1360" y="235" width="184" height="78" rx="12" fill="#ffffff" stroke="#b5cbd0" stroke-width="2"/>
<text x="1373" y="265" font-size="21" fill="#183244" font-weight="700">夹具</text>
<text x="1373" y="294" font-size="17" fill="#486475" font-weight="400">F+ 到被测件</text>
<polyline points="271,274 320,274" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="532,274 579,274" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="767,274 817,274" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="1026,274 1080,274" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="1310,274 1360,274" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="556,274 556,348 595,348" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="556" cy="274" r="5" fill="#176c91"/>
<polyline points="1195,313 1195,375 1010,375" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="595" y="326" width="415" height="78" rx="12" fill="#ffffff" stroke="#b5cbd0" stroke-width="2"/>
<text x="608" y="356" font-size="21" fill="#183244" font-weight="700">KCAL-B 反馈选择</text>
<text x="608" y="385" font-size="17" fill="#486475" font-weight="400">COM → 新 R5 → J7</text>
<text x="541" y="388" font-size="18" fill="#b84432" font-weight="400">NC</text>
<text x="1025" y="369" font-size="18" fill="#b84432" font-weight="400">NO</text>
<text x="1022" y="400" font-size="17" fill="#486475" font-weight="400">正常读取 TP1</text>
<text x="391" y="408" font-size="17" fill="#486475" font-weight="400">校准读取 PA_OUT</text>
<rect x="56" y="481" width="215" height="78" rx="12" fill="#ffffff" stroke="#b5cbd0" stroke-width="2"/>
<text x="69" y="511" font-size="21" fill="#183244" font-weight="700">U1B 脚 7</text>
<text x="69" y="540" font-size="17" fill="#486475" font-weight="400">转接板顶层 RAW_B</text>
<rect x="320" y="481" width="212" height="78" rx="12" fill="#ffffff" stroke="#b5cbd0" stroke-width="2"/>
<text x="333" y="511" font-size="21" fill="#183244" font-weight="700">UB · BUF634A</text>
<text x="333" y="540" font-size="17" fill="#486475" font-weight="400">IN=RAW_B / OUT=TP2</text>
<rect x="579" y="481" width="468" height="78" rx="12" fill="#ffffff" stroke="#b5cbd0" stroke-width="2"/>
<text x="592" y="511" font-size="21" fill="#183244" font-weight="700">TP2 / 跨阻输出</text>
<text x="592" y="540" font-size="17" fill="#486475" font-weight="400">板座 F8；D8 接反馈板；C8 接 ADC 保护</text>
<polyline points="271,520 320,520" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="532,520 579,520" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="56" y="632" width="716" height="201" rx="12" fill="#fff" stroke="#b5cbd0" stroke-width="2"/>
<text x="78" y="671" font-size="26" fill="#176c91" font-weight="700">转接板隔离 1、3、7，其余直通</text>
<text x="78" y="711" font-size="21" fill="#183244" font-weight="400">顶脚 1 → UA IN；底脚 1 / I7 ← RSC 的负载侧。</text>
<text x="78" y="744" font-size="21" fill="#183244" font-weight="400">顶脚 3 ← GATED；底脚 3 / I9 → UGate.NO。</text>
<text x="78" y="777" font-size="21" fill="#183244" font-weight="400">顶脚 7 → UB IN；底脚 7 / F8 ← UB OUT。</text>
<text x="78" y="810" font-size="21" fill="#183244" font-weight="400">2、4、5、6、8 原样直连，U1 依旧用 3.3 V。</text>
<rect x="801" y="632" width="743" height="201" rx="12" fill="#fff" stroke="#b5cbd0" stroke-width="2"/>
<text x="823" y="671" font-size="26" fill="#176c91" font-weight="700">模拟电源与 BUF634AID 接法</text>
<text x="823" y="711" font-size="21" fill="#183244" font-weight="400">两只：脚 7=+5 V、脚 4=−5 V、脚 3 输入、脚 6 输出。</text>
<text x="823" y="744" font-size="21" fill="#183244" font-weight="400">脚 1 BW 接 −5 V；2/5/8 NC。每只每轨 100 nF 就近。</text>
<text x="823" y="777" font-size="21" fill="#183244" font-weight="400">RSH2：14 脚 +5 V，1 脚 GND，2 脚 CTRL 悬空。</text>
<text x="823" y="810" font-size="21" fill="#183244" font-weight="400">8 脚 +Vout 接地，9 脚为 −5 V 轨。−轨电容正端接地。</text>
<rect x="56" y="875" width="1488" height="201" rx="12" fill="#fff" stroke="#b5cbd0" stroke-width="2"/>
<text x="78" y="914" font-size="26" fill="#176c91" font-weight="700">KCAL 的两个触点必须一起动作</text>
<text x="78" y="954" font-size="21" fill="#183244" font-weight="400">PB15=0：串入 RSC 并回采 PA_OUT，用于限流试测和短路校准。PB15=1：旁路 RSC 并回采 TP1，用于正常测量。</text>
<text x="78" y="987" font-size="21" fill="#183244" font-weight="400">新 R5 用 10 kΩ 串 20 kΩ 微调（滑端短接一端），接在 KCAL-B.COM 和 J7。R6 10 kΩ 留用，先调到约 13 kΩ 总值。</text>
<text x="78" y="1020" font-size="21" fill="#183244" font-weight="400">PA_OUT 至 J7 常接 1 MΩ，KCAL-B 转换时保持直流反馈。两轨各加 10 µF 并按 DCDC 数据手册核对。</text>
<text x="78" y="1053" font-size="21" fill="#183244" font-weight="400">先在 1 kΩ 检查两个环路无振荡，再上 10 Ω。按 TP1 实测把 0.5 Vrms 调到位，并核验 100 Hz、1 kHz、10 kHz 和 100 kHz。</text>
</g></svg>