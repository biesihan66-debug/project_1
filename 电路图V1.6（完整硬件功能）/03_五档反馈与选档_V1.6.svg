<text x="572" y="715" font-size="20" fill="#183244" font-weight="400">RB 10 MΩ ∥ CB 2.2 pF</text>
<polyline points="865,708 1242,708" fill="none" stroke="#176c91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="56" y="772" width="721" height="267" rx="12" fill="#fff" stroke="#b5cbd0" stroke-width="2"/>
<text x="78" y="811" font-size="26" fill="#176c91" font-weight="700">译码与继电器</text>
<text x="78" y="851" font-size="21" fill="#183244" font-weight="400">CD74HC238 @3.3 V：A0=PB0、A1=PB1、A2=PB11。</text>
<text x="78" y="884" font-size="21" fill="#183244" font-weight="400">高有效使能接 3.3 V，两低有效使能接地。</text>
<text x="78" y="917" font-size="21" fill="#183244" font-weight="400">Y1～Y4 → ULN2003LV IN2～5 → K1～K4。</text>
<text x="78" y="950" font-size="21" fill="#183244" font-weight="400">Y1～Y4 经 3 个 OR 门 → IN1 → K0。</text>
<text x="78" y="983" font-size="21" fill="#183244" font-weight="400">PB15 → IN6 → KCAL。COM 接 +5 V，IN7 接地。</text>
<text x="78" y="1016" font-size="21" fill="#183244" font-weight="400">全部线圈一端 +5 V，另一端接各自 OUT。</text>
<rect x="804" y="772" width="740" height="267" rx="12" fill="#fff" stroke="#b5cbd0" stroke-width="2"/>
<text x="826" y="811" font-size="26" fill="#176c91" font-weight="700">默认态与每档对应</text>
<text x="826" y="851" font-size="21" fill="#183244" font-weight="400">000 / 101 / 110 / 111：K0 释放 → 4.99 Ω。</text>
<text x="826" y="884" font-size="21" fill="#183244" font-weight="400">001：K0 + K1 → 100 Ω；010：K0 + K2 → 1 kΩ。</text>
<text x="826" y="917" font-size="21" fill="#183244" font-weight="400">011：K0 + K3 → 10 kΩ；100：K0 + K4 → 100 kΩ。</text>
<text x="826" y="950" font-size="21" fill="#183244" font-weight="400">三个控制输入各加 47 kΩ 下拉。线圈回流走电源侧。</text>
<text x="826" y="983" font-size="21" fill="#183244" font-weight="400">10 MΩ∥2.2 pF 始终接入。各档有效值含它和触点。</text>
<text x="826" y="1016" font-size="21" fill="#183244" font-weight="400">10 kΩ/100 kΩ 预留 C0G 位，样机按振铃实测定值。</text>
